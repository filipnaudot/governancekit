# Serves the built frontend. index.html is checked with the server on every
# load, so a rebuilt frontend is picked up; the files in /assets have a hash
# in their names, so they never change and are cached for a long time.
server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
