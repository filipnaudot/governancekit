# Development overrides: run the API and the frontend from the working tree
# with hot reload.
# Usage: docker compose -f compose.yaml -f compose.dev.yaml up --build
services:
  api:
    # Without the timeout, an open frontend's update stream delays every reload
    command: ["uvicorn", "governancekit.server.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--timeout-graceful-shutdown", "2"]
    environment:
      # Import the mounted source instead of the copy installed in the image
      PYTHONPATH: /app/src
    volumes:
      - ./src:/app/src

  frontend:
    build:
      target: dev
    ports: !override
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Keep the container's own node_modules instead of the host's
      - /app/node_modules
